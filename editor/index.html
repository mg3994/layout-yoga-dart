<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga & DartNative Responsive UI Visual Editor</title>
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome / Icons if needed -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app">
    <!-- Header Navbar -->
    <header class="navbar">
      <div class="logo">
        <span class="logo-icon">🧘⚡</span>
        <span class="logo-title">Yoga <strong>Native Studio</strong></span>
        <span class="tag">DartNative Edition</span>
      </div>

      <div class="top-controls">
        <div class="device-selector">
          <button class="device-btn active" data-device="iphone-14">
            <i class="fa-solid fa-mobile-screen"></i> iPhone 14 Pro (393 x 852)
          </button>
          <button class="device-btn" data-device="pixel-7">
            <i class="fa-brands fa-android"></i> Pixel 7 Pro (412 x 892)
          </button>
          <button class="device-btn" data-device="ipad">
            <i class="fa-solid fa-tablet-screen-button"></i> iPad Mini (744 x 1133)
          </button>
          <button class="device-btn" data-device="responsive">
            <i class="fa-solid fa-expand"></i> Responsive Canvas
          </button>
        </div>
      </div>

      <div class="actions">
        <button id="btn-export-json" class="btn secondary">
          <i class="fa-solid fa-file-code"></i> Schema JSON
        </button>
        <button id="btn-export-code" class="btn primary">
          <i class="fa-solid fa-bolt"></i> Export Dart & Native Code
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left Sidebar: Component Palette & Tree Hierarchy -->
      <aside class="sidebar left-sidebar">
        <div class="panel-section">
          <h3><i class="fa-solid fa-cubes"></i> UI Components</h3>
          <div class="palette-grid">
            <button class="palette-item" data-type="Container">
              <i class="fa-regular fa-square"></i> Container
            </button>
            <button class="palette-item" data-type="Text">
              <i class="fa-solid fa-font"></i> Text Label
            </button>
            <button class="palette-item" data-type="Button">
              <i class="fa-solid fa-hand-pointer"></i> Button
            </button>
            <button class="palette-item" data-type="Image">
              <i class="fa-regular fa-image"></i> Image
            </button>
            <button class="palette-item" data-type="TextInput">
              <i class="fa-solid fa-i-cursor"></i> Text Input
            </button>
            <button class="palette-item" data-type="ScrollView">
              <i class="fa-solid fa-arrows-up-down"></i> Scroll View
            </button>
          </div>
        </div>

        <div class="panel-section flex-1 tree-section">
          <h3><i class="fa-solid fa-sitemap"></i> Component Tree</h3>
          <div id="tree-view" class="tree-container">
            <!-- Populated dynamically via JavaScript -->
          </div>
        </div>
      </aside>

      <!-- Center Viewport Canvas -->
      <section class="canvas-wrapper">
        <div class="canvas-toolbar">
          <span class="canvas-info" id="canvas-dim-info">393 x 852 px</span>
          <div class="zoom-controls">
            <button id="zoom-out"><i class="fa-solid fa-minus"></i></button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>

        <div class="canvas-container" id="canvas-container">
          <div class="device-frame iphone-14" id="device-frame">
            <div id="yoga-canvas" class="yoga-canvas-root">
              <!-- Rendered layout tree nodes -->
            </div>
          </div>
        </div>
      </section>

      <!-- Right Sidebar: Inspector & Code Generator Panel -->
      <aside class="sidebar right-sidebar">
        <div class="tabs">
          <button class="tab-btn active" data-tab="tab-inspector">
            <i class="fa-solid fa-sliders"></i> Inspector
          </button>
          <button class="tab-btn" data-tab="tab-bindings">
            <i class="fa-solid fa-plug"></i> Dart Bindings
          </button>
          <button class="tab-btn" data-tab="tab-code">
            <i class="fa-solid fa-code"></i> Generated Code
          </button>
        </div>

        <div class="tab-content active" id="tab-inspector">
          <div id="inspector-properties">
            <!-- Property controls populated dynamically -->
          </div>
        </div>

        <div class="tab-content" id="tab-bindings">
          <div id="dart-bindings-panel">
            <!-- DartNative action & state bindings -->
          </div>
        </div>

        <div class="tab-content" id="tab-code">
          <div class="code-preview-container">
            <div class="code-subtabs">
              <button class="subtab-btn active" data-lang="dart">Dart Controller</button>
              <button class="subtab-btn" data-lang="objc">iOS (YogaKit)</button>
              <button class="subtab-btn" data-lang="java">Android (Yoga)</button>
              <button class="subtab-btn" data-lang="json">Schema JSON</button>
            </div>
            <pre><code id="code-output">// Select a layout node or click "Export Code"</code></pre>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/codegen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
